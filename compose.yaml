services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["9000"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SUMM_DOMAIN: ${SUMM_DOMAIN:-booksumm.duckdns.org}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  caddy_data:
  caddy_config:
